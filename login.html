<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height: 100vh;">
    <div class="form-container" style="width:100%; max-width:400px; margin: 20px;">
        <h2 id="form-title">Вход</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button id="submit-btn" class="btn-submit" onclick="handleAuth()">Войти</button>
        <p style="text-align:center; margin-top: 20px; font-size: 0.9rem;">
            <a href="#" id="toggle-link" style="color:var(--brand-purple); text-decoration:none;" onclick="toggleMode(event)">Нет аккаунта? Зарегистрироваться</a>
        </p>
        <div style="margin-top:20px; font-size:0.8rem; text-align:center; color:var(--text-muted);">
            <p>Тестовый студент: <b>student@test.ru</b> / <b>123</b></p>
            <p>Тестовый админ: <b>admin@test.ru</b> / <b>admin</b></p>
        </div>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ УВЕДОМЛЕНИЙ -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/auth.js"></script>
    <script>
        if (localStorage.getItem('currentUser')) window.location.href = 'index.html';
        let isLoginMode = true;

        function toggleMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? 'Вход' : 'Регистрация';
            document.getElementById('submit-btn').innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('toggle-link').innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { 
                showToast('Заполните все поля!', 'error'); 
                return; 
            }

            if (isLoginMode) {
                loginUser(email, password);
            } else {
                if (registerUser(email, password)) {
                    isLoginMode = false;
                    toggleMode(new Event('click')); 
                    document.getElementById('password').value = '';
                }
            }
        }
    </script>
</body>
</html>
